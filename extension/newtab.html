<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Warehouse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/ui/button.css" />
    <link rel="stylesheet" href="styles/ui/search.css" />
    <link rel="stylesheet" href="styles/ui/chip.css" />
    <link rel="stylesheet" href="styles/ui/pickers.css" />
    <link rel="stylesheet" href="styles/ui/badge.css" />
    <link rel="stylesheet" href="styles/ui/row.css" />
    <link rel="stylesheet" href="styles/ui/menu.css" />
    <link rel="stylesheet" href="styles/ui/edit.css" />
    <link rel="stylesheet" href="styles/ui/toast.css" />
    <link rel="stylesheet" href="styles/ui/motion.css" />
    <link rel="stylesheet" href="styles/ui/seg.css" />
    <link rel="stylesheet" href="styles/views/shell.css" />
    <link rel="stylesheet" href="styles/views/sidebar.css" />
    <link rel="stylesheet" href="styles/views/home.css" />
    <link rel="stylesheet" href="styles/views/folder/page.css" />
    <link rel="stylesheet" href="styles/views/folder/list.css" />
    <link rel="stylesheet" href="styles/views/schedule.css" />
    <link rel="stylesheet" href="styles/views/folder/matrix.css" />
    <link rel="stylesheet" href="styles/views/narrow.css" />
    <link rel="stylesheet" href="styles/views/settings/index.css" />
    <link rel="stylesheet" href="styles/views/settings/appearance.css" />
    <link rel="stylesheet" href="styles/views/settings/duplicates.css" />
    <link rel="stylesheet" href="styles/views/settings/shortcuts.css" />
    <link rel="stylesheet" href="styles/views/settings/home-page.css" />
    <link rel="stylesheet" href="styles/views/settings/tags.css" />
    <link rel="stylesheet" href="styles/views/board.css" />
  </head>
  <body>
    <div class="side-backdrop" aria-hidden="true">
      <div class="side-img"></div>
      <div class="side-shade"></div>
    </div>
    <aside class="side">
      <div class="brand">
        <img class="logo" id="logo" src="icons/icon48.png" alt="" />
        <h1 id="brandTitle">Tab Warehouse</h1>
        <button class="btn icon ghost sm" id="settingsBtn" aria-label="Settings" title="Settings" aria-pressed="false"><span id="gearIcon"></span></button>
      </div>
      <div class="search-row">
        <label class="search sm">
          <span class="sr">Search all bookmarks</span>
          <span id="searchIcon"></span>
          <input type="search" id="q" placeholder="Search all…" autocomplete="off" />
          <span class="kbd" title="Press / to search.">/</span>
        </label>
      </div>
      <div class="view-tabs" role="group" aria-label="View">
        <button class="view-tab" id="homeBtn" aria-label="Home" title="Home · drop a link here to add it to Home">
          <span id="homeIcon"></span><span class="lbl">Home</span>
        </button>
        <button class="view-tab" id="boardBtn" aria-label="Board" title="Board · all folders as columns">
          <span id="boardIcon"></span><span class="lbl">Board</span>
        </button>
      </div>
      <button class="nav today-nav" id="scheduleBtn" aria-label="Today's top list" title="Today's top list · links due today and later">
        <span class="today-ic" id="scheduleIcon"></span><span class="t">Today's top list</span
        ><span class="today-cnt" id="todayCnt" aria-hidden="true" hidden></span>
      </button>
      <nav id="nav" aria-label="Folders"></nav>
      <button class="btn ghost sm newFolder" id="newFolderBtn"><span id="plusIcon"></span>New folder</button>
      <button class="btn ghost sm newFolder newCat" id="newCatBtn"><span id="catIcon"></span>New category</button>
      <footer class="side-foot" id="sideFoot">
        <span>Made by Sumonta</span>
        <a class="btn icon ghost sm" id="ghLink" href="https://github.com/sumonta056" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"
          ><span id="ghIcon"></span
        ></a>
        <a class="btn icon ghost sm" id="webLink" href="https://sumonta056.vercel.app/" target="_blank" rel="noopener" aria-label="Portfolio" title="Portfolio"
          ><span id="webIcon"></span
        ></a>
      </footer>
    </aside>
    <div
      class="resizer"
      id="resizer"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize sidebar"
      tabindex="0"
      title="Drag to resize · double-click to reset"
    ></div>

    <main class="page" id="page"></main>
    <button class="home-fab" id="homeFab" aria-label="Go to Home" title="Home" hidden><span id="fabIcon"></span></button>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
