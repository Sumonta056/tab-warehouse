<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Tab Warehouse</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/ui/button.css" />
    <link rel="stylesheet" href="styles/ui/search.css" />
    <link rel="stylesheet" href="styles/ui/chip.css" />
    <link rel="stylesheet" href="styles/ui/pickers.css" />
    <link rel="stylesheet" href="styles/ui/badge.css" />
    <link rel="stylesheet" href="styles/ui/row.css" />
    <link rel="stylesheet" href="styles/ui/menu.css" />
    <link rel="stylesheet" href="styles/ui/edit.css" />
    <link rel="stylesheet" href="styles/ui/toast.css" />
    <link rel="stylesheet" href="styles/ui/motion.css" />
    <link rel="stylesheet" href="styles/views/popup.css" />
  </head>
  <body>
    <div class="page" id="page"></div>
    <div class="sec switch" id="switch" hidden></div>
    <div class="sec" id="meta"></div>
    <div id="exists"></div>
    <div class="sec pick">
      <label class="search">
        <span class="sr">Find or create folder</span>
        <span id="searchIcon"></span>
        <input type="search" id="q" placeholder="Find or create folder…" autocomplete="off" />
      </label>
      <div class="folders" id="folders" role="listbox" aria-label="Folders"></div>
    </div>
    <div class="bar">
      <div class="status" id="status" role="status"></div>
      <div class="bar-row">
        <div class="hints">
          <span><span class="kbd">↑↓</span> folder · <span class="kbd">↵</span> save</span>
          <button id="openBoard">Open Tab Warehouse</button>
        </div>
        <button class="btn primary" id="save"></button>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
